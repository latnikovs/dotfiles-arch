onboarding = false

[theme]
name = "nord"
auto_switch = false

[keys]
# Navigate mode (prefix+w): j/k move between workspaces, arrows still work too.
# Panes take ctrl+j/k there instead; h/l (and left/right) stay on panes.
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"

# Agent picker: j/k to select, Enter to jump; prefix+a added as an "agents" alias
goto = ["prefix+g", "prefix+a"]

[ui]
status_indicators = "symbols"

# Space number in front of the name, i.e. what navigate mode (prefix+w, then 1..9) jumps to. No
# built-in token for it: $num is reported by ~/.config/hypr/scripts/herd-numbers (started by herd)
[ui.sidebar.spaces]
rows = [["state_icon", { token = "$num", dim = true }, "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "off"

# Lazygit popup over the current tab in the focused pane's repo (tmux: prefix+g)
[[keys.command]]
key = "prefix+d"
type = "popup"
command = 'lazygit -p "$HERDR_ACTIVE_PANE_CWD"'
width = "100%"
height = "100%"
