# Idle: lock after 15 minutes, screens off 30 seconds later, and lock before suspend.
# Locking goes through logind (loginctl lock-session), so KeePassXC locks its databases too.
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.config/hypr/scripts/lock now
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/dpms on
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 930
    on-timeout = ~/.config/hypr/scripts/dpms off
    on-resume = ~/.config/hypr/scripts/dpms on
}
