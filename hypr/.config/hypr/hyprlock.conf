# Lock screen (SUPER + CTRL + L, and after 15 idle minutes via hypridle.conf), in Nord.
# Started by ~/.config/hypr/scripts/lock, which switches to the first keyboard layout first.
# The login screen (greeter/shell.qml) has the same look; keep them in step.
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = out, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, out
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 3, linear
}

# The current dark-mode wallpaper (scripts/wallpaper), blurred and darkened
background {
    monitor =
    path = ~/.local/state/hypr/wallpaper-dark
    color = rgb(2e3440)
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    vibrancy = 0.17
}

# Date, spaced-out capitals in the accent colour
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='5000'>$(date +"%A  %-d %B" | tr '[:lower:]' '[:upper:]')</span>"
    color = rgb(88c0d0)
    font_size = 14
    font_family = $font Medium
    text_align = center
    position = 0, 250
    halign = center
    valign = center
}

# Clock, thin, with an accent colon
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)<span foreground='##88c0d0'>:</span>$(date +%M)"
    color = rgb(eceff4)
    font_size = 150
    font_family = $font Thin
    position = 0, 140
    halign = center
    valign = center
}

# Greeting, with the account's full name if it has one
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); [ $h -lt 5 ] && g=night || { [ $h -lt 12 ] && g=morning; } || { [ $h -lt 18 ] && g=afternoon; } || g=evening; echo "Good $g, ${n:-$USER}"
    color = rgb(d8dee9)
    font_size = 16
    font_family = $font Light
    position = 0, 20
    halign = center
    valign = center
}

# Password, in a glass pill
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = -1
    outer_color = rgba(eceff440)
    inner_color = rgba(2e344099)
    font_color = rgb(eceff4)
    font_family = $font
    check_color = rgb(ebcb8b)
    fail_color = rgb(bf616a)
    capslock_color = rgb(ebcb8b)
    placeholder_text = <i><span foreground="##7b88a1">Password</span></i>
    fail_text = <span foreground="##bf616a">Wrong password</span> <span foreground="##7b88a1">($ATTEMPTS)</span>
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    position = 0, -50
    halign = center
    valign = center
}

# Keyboard layout, so a password is never typed in the wrong alphabet unnoticed
label {
    monitor =
    text = 󰌌  $LAYOUT[EN,LV,RU]
    color = rgb(7b88a1)
    font_size = 11
    font_family = $font
    position = 0, -105
    halign = center
    valign = center
}

# The machine's name, bottom left, as on the login screen
label {
    monitor =
    text = cmd[] echo "   $(cat /etc/hostname)"
    color = rgb(7b88a1)
    font_size = 11
    font_family = $font
    position = 32, 32
    halign = left
    valign = bottom
}
