# Lock screen (SUPER + CTRL + L, and after 5 idle minutes via hypridle.conf), in Nord.
# Started by ~/.config/hypr/scripts/lock, which switches to the first keyboard layout first.
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# The current wallpaper (scripts/wallpaper), blurred and darkened
background {
    monitor =
    path = ~/.local/state/hypr/wallpaper
    color = rgb(2e3440)
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(eceff4)
    font_size = 120
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgb(d8dee9)
    font_size = 22
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    rounding = 12
    outer_color = rgb(88c0d0)
    inner_color = rgba(2e3440cc)
    font_color = rgb(eceff4)
    font_family = $font
    check_color = rgb(ebcb8b)
    fail_color = rgb(bf616a)
    capslock_color = rgb(ebcb8b)
    placeholder_text = <span foreground="##d8dee9">  $USER</span>
    fail_text = $FAIL ($ATTEMPTS)
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Keyboard layout, so a password is never typed in the wrong alphabet unnoticed
label {
    monitor =
    text = 󰌌  $LAYOUT[EN,LV,RU]
    color = rgb(81a1c1)
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
