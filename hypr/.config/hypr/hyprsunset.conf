# Night light: warmer colours from 21:00 to 07:00, like macOS Night Shift.
# SUPER + CTRL + N flips it by hand until the next switch (scripts/nightlight).
# Restart after editing: pkill -x hyprsunset; hyprctl dispatch 'hl.dsp.exec_cmd("hyprsunset")'
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

# Day: leave the screen's colours alone
profile {
    time = 07:00
    identity = true
}

# Night: 4000K, as in Omarchy's toggle (6500K is neutral, lower is warmer)
profile {
    time = 21:00
    temperature = 4000
}
