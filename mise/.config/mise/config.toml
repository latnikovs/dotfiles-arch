# Global dev tools; a project's own mise.toml (or .nvmrc, .terraform-version, …)
# overrides these inside it. install.sh runs `mise install` for this list.
[tools]
node = "lts"
pnpm = "latest"
go = "latest"
# Rebuilds Go on file changes (make dev / pnpm run dev)
air = "latest"
# Temurin: jdk.java.net's plain openjdk-25 build never gets security updates
java = "temurin-25"
terraform = "latest"
gcloud = "latest"
shellcheck = "latest"
# Lua formatter for the Neovim config (make lint)
stylua = "latest"

[settings]
# mise up must not delete the version a running process is executing from
upgrade.auto_prune = false
