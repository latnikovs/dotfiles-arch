# Per-machine WirePlumber rules for the UTM VM. Installed as
# ~/.config/wireplumber/wireplumber.conf.d/50-machine.conf by: ./install.sh utm-vm

# UTM's emulated sound card (Intel HDA with a "QEMU Generic" codec) has a volume
# control that the emulation ignores, so the volume slider did nothing. Volume is
# applied in software instead, and the card's own control stays at full.
monitor.alsa.rules = [
  {
    matches = [
      { device.product.name = "~.*QEMU Virtual Machine.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
