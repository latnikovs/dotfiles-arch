# Nord
foreground            #d8dee9
background            #2e3440
selection_foreground  #d8dee9
selection_background  #434c5e
url_color             #88c0d0
cursor                #d8dee9
cursor_text_color     #2e3440
active_border_color   #88c0d0
inactive_border_color #4c566a

# black
color0  #3b4252
color8  #4c566a
# red
color1  #bf616a
color9  #bf616a
# green
color2  #a3be8c
color10 #a3be8c
# yellow
color3  #ebcb8b
color11 #ebcb8b
# blue
color4  #81a1c1
color12 #81a1c1
# magenta
color5  #b48ead
color13 #b48ead
# cyan
color6  #88c0d0
color14 #8fbcbb
# white
color7  #e5e9f0
color15 #eceff4

# Slight transparency (Hyprland blurs what's behind)
background_opacity 0.9

# Lower input latency (kitty batches input and redraws by default)
input_delay     0
repaint_delay   2
sync_to_monitor no

# Clipboard: SUPER + C/V send CTRL + SHIFT + C/V (kitty defaults); CTRL/SHIFT + Insert as in
# Omarchy, SHIFT + Insert from the clipboard (not the primary selection) for clipboard-history
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
