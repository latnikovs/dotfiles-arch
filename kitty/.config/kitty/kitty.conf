# Colours: Nord, light or dark with the desktop (dark-theme.auto.conf,
# light-theme.auto.conf); dark until the color-scheme setting says otherwise
include dark-theme.auto.conf

# Slight transparency (Hyprland blurs what's behind)
background_opacity 0.9

# Lower input latency (kitty batches input and redraws by default)
input_delay     0
repaint_delay   2
sync_to_monitor no

# Clipboard: SUPER + C/V send CTRL + SHIFT + C/V (kitty defaults); CTRL/SHIFT + Insert as in
# Omarchy, SHIFT + Insert from the clipboard (not the primary selection) for clipboard-history
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
