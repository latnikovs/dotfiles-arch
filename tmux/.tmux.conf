# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB,xterm-256color:RGB"

set -g history-limit 100000
set -g escape-time 0
set -g focus-events on

# Let programs talk to kitty directly past tmux. Neovim draws images in notes
# through kitty's graphics protocol (snacks.nvim image), which tmux otherwise
# swallows.
set -gq allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Windows are named after whatever is running in them (see
# automatic-rename-format below), which is what the icon map keys off.
set -g automatic-rename on
set -g allow-rename off

# Publish the session name as the terminal title, so the kitty tab holding this
# session is labelled with it (kitty renders it through tab_title_template, as
# "1: dotfiles"). It tracks renames and session switches, not just the launch.
set -g set-titles on
set -g set-titles-string "#S"


##### Prefix / key bindings #####
# Change prefix from Ctrl-b to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config quickly: Prefix + r
# Via reload.sh rather than source-file directly, so that a flavor change is
# actually picked up on a running server. See the script.
bind r run-shell '~/.tmux/scripts/reload.sh' \; display-message "tmux.conf reloaded"

# Kill pane without confirmation: Prefix + x
bind x kill-pane

# New workspace: Prefix + N picks a project under ~/Work and opens a session for
# it, named after it and started in it, or goes to the one already open. A name
# that matches no project makes a plain session of that name. Capital N so it
# doesn't clash with next-window navigation. See the script.
bind N display-popup -w 60% -h 60% -x C -y C -E "~/.tmux/scripts/new-workspace.sh"

##### Splits #####
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-style pane movement (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Resize panes with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Popups #####
# Prefix + t → terminal, Prefix + g → git. Both centered at 90%, opened in the
# directory of the pane you pressed them from.
unbind t
bind-key t display-popup -w 90% -h 90% -x C -y C -d "#{pane_current_path}" "$SHELL -i"

unbind g
bind-key g display-popup -w 90% -h 90% -x C -y C -d "#{pane_current_path}" -E "lazygit"

# Prefix + a → agent picker: every Claude on the server, the ones asking for you
# first, with a live preview. Enter jumps there across sessions. See the script.
bind-key a display-popup -w 90% -h 90% -x C -y C -E "~/.tmux/scripts/pick-agent.sh"

# Alt + 1..9 → workspace 1..9, the numbers on the sidebar. See the script.
bind -n M-1 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 1"
bind -n M-2 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 2"
bind -n M-3 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 3"
bind -n M-4 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 4"
bind -n M-5 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 5"
bind -n M-6 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 6"
bind -n M-7 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 7"
bind -n M-8 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 8"
bind -n M-9 run-shell -b "~/.tmux/scripts/goto-workspace.sh '#{client_name}' 9"

##### Mouse #####
set -g mouse on

# Click an agent, land on it. Every Claude glyph on the window chips is wrapped
# in a `#[range=user|<pane id>]` range (see the status bar section), which tmux
# reports as #{mouse_status_range} when clicked. A user range triggers the
# `Status` mouse key wherever it is drawn, so this does not disturb the
# StatusLeft / StatusRight bindings. Anything that is not one of our ids is a
# plain window chip and keeps select-window.
#
# The jump goes through scripts/goto-agent.sh rather than `switch-client -t=`
# because a target given by the mouse resolves against the clicking client's
# own session, and the sidebar uses it to reach the agents in the others. The
# client is passed in since run-shell runs outside of one.
bind -n MouseDown1Status if -F '#{m:[%$]*,#{mouse_status_range}}' \
	'run-shell -b "~/.tmux/scripts/goto-agent.sh #{client_name} #{mouse_status_range}"' \
	'select-window -t='

##### Sidebar #####
# The workspaces down the left of every window, as in herdr: each session with
# its branch and its Claudes. Everything about it is in scripts/sidebar.sh;
# what is here is the wiring. Prefix + b takes it away and brings it back.
bind b run-shell -b '~/.tmux/scripts/sidebar.sh toggle'

# Closing the workspace a client is on (the sidebar's ×, or its last window
# going) moves the client to the one it used before, rather than detaching it
# and taking the kitty window with it.
set -g detach-on-destroy previous

# A click on the sidebar goes where the line clicked says, and the focus stays
# on the real panes; anywhere else it is tmux's own binding. The wheel does
# nothing there, rather than freeze it in copy mode.
bind -n MouseDown1Pane if -F '#{@sidebar}' \
	{ run-shell -b '~/.tmux/scripts/sidebar.sh click "#{client_name}" "#{pane_id}" "#{mouse_y}" "#{mouse_x}"' } \
	{ select-pane -t = ; send-keys -M }
bind -n WheelUpPane if -F '#{@sidebar}' {} \
	{ if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e } }

# Each new window gets one, and the sidebars hear about whatever changes what
# they show. At index 42 so a reload replaces them rather than adding a second
# set, and so they sit apart from any hook a plugin appends.
set-hook -g 'after-new-window[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh ensure #{window_id}'"
# Every window, not the new session's: the hook has no id for it (#{session_id}
# is empty here), and its current window may already be a later one by the time
# the hook runs.
set-hook -g 'session-created[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh ensure-all ; ~/.tmux/scripts/sidebar.sh signal'"
set-hook -g 'session-closed[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh signal'"
set-hook -g 'session-renamed[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh signal'"
set-hook -g 'session-window-changed[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh shown'"
set-hook -g 'client-session-changed[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh shown'"
set-hook -g 'client-attached[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh shown'"
set-hook -g 'client-resized[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh signal'"
# A window down to its sidebar closes, as it would have without one.
set-hook -g 'pane-exited[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh tidy'"
set-hook -g 'after-kill-pane[42]' "run-shell -b '~/.tmux/scripts/sidebar.sh tidy'"

# And the windows already there, on a reload or a server started on this file.
run-shell -b '~/.tmux/scripts/sidebar.sh ensure-all'

##### Copy mode (vi-style) #####
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

# tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate

set -g @plugin 'catppuccin/tmux' # styles the bar and borders from the @thm_* palette below

set -g @sessionx-bind 'o'

# Sessions, windows and pane directories saved every 15 minutes (continuum) and
# restored when the server starts, the way herdr brings its workspaces back.
# Claude is not one of the programs resurrect restarts; claude-resume.sh puts
# each one back into its pane, in the conversation it had open.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-hook-post-save-all '~/.tmux/scripts/claude-resume.sh save'
# The sidebars sit the restore out; see `suspend` in scripts/sidebar.sh.
set -g @resurrect-hook-pre-restore-all '~/.tmux/scripts/sidebar.sh suspend'
set -g @resurrect-hook-post-restore-all '~/.tmux/scripts/claude-resume.sh restore; ~/.tmux/scripts/sidebar.sh restored'

##### Theme #####
# Nord, light or dark after the OS appearance, exactly like kitty via
# light-theme.auto.conf / dark-theme.auto.conf. The Catppuccin plugin still draws
# everything, but only fills in @thm_* options that are unset (set -o), so the
# Nord palette set here wins. This has to run before the plugin loads, which is
# why the tpm `run` line stays at the very bottom of this file.
if-shell '[ "$(~/.tmux/scripts/flavor.sh)" = light ]' \
	'source-file ~/.tmux/nord-light.conf' \
	'source-file ~/.tmux/nord-dark.conf'

# Publishes the pill caps and Nerd Font icons as @cap_* / @ico_* options. tmux
# config has no \u escape, so this keeps private-use codepoints out of this file
# where they would be invisible and easy to lose. See scripts/icons.sh.
run-shell '~/.tmux/scripts/icons.sh'

set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
# Border colors must go through the plugin's own options, not pane-border-style
# directly: tpm loads catppuccin at the bottom of this file and overwrites the
# tmux options, so anything set here by hand is discarded. @thm_fg is the
# palette's foreground -- near-white in dark mode, near-black in light -- so the
# focused pane stays the high-contrast one in both.
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_fg}"

##### Panes #####
# Which pane has focus, at a glance. tmux borders are always one cell wide --
# `heavy` picks the thicker box-drawing glyphs, which is as bold as it gets.
# (Colors are set above, via the @catppuccin_* options.)
# With exactly two panes tmux colours only *half* the divider as its focus hint
# (pane-border-indicators, default `colour`). Turn that off so the whole border
# takes the active style -- the half-lit line reads as a rendering glitch.
set -g pane-border-indicators off
set -g pane-border-lines heavy

##### Status bar #####
# The bar is transparent and every module is a rounded pill floating on the
# terminal background. Modules live in ~/.tmux/scripts and print their own
# styling; see scripts/lib.sh for why the colors are passed as arguments.
set -g status-position top
set -g status-style "bg=default"
# Left: the window list starts where the panes right of the sidebar do, so the
# tabs sit over the work they belong to, as herdr has them. status-left is
# padded to the sidebar's width plus its border (see the status left section).
set -g status-justify "left"
set -g status-interval 5

# @is_claude: is this pane running Claude Code? Its process has gone by two
# names: older releases overwrite argv[0] with a bare version ("2.1.212"),
# newer ones keep 'claude'. Everything that asks goes through this one format.
set -g @is_claude "#{||:#{==:#{pane_current_command},claude},\
#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}}}"

# Nerd Font icon for whatever the window is running. Kept in an option so the
# status formats below stay readable; #{E:@win_icon} expands it per window.
set -g @win_icon "#{?#{E:@is_claude},#{@ico_claude},\
#{?#{m:*nvim*,#{pane_current_command}},#{@ico_nvim},\
#{?#{m:*vim*,#{pane_current_command}},#{@ico_vim},\
#{?#{==:#{pane_current_command},lazygit},#{@ico_git},\
#{?#{==:#{pane_current_command},git},#{@ico_git},\
#{?#{==:#{pane_current_command},go},#{@ico_go},\
#{?#{m:node*,#{pane_current_command}},#{@ico_node},\
#{?#{m:*npm*,#{pane_current_command}},#{@ico_node},\
#{?#{m:python*,#{pane_current_command}},#{@ico_python},\
#{?#{==:#{pane_current_command},docker},#{@ico_docker},\
#{?#{==:#{pane_current_command},ssh},#{@ico_ssh},\
#{?#{m:java*,#{pane_current_command}},#{@ico_java},\
#{?#{m:*sh,#{pane_current_command}},#{@ico_shell},\
#{@ico_default}}}}}}}}}}}}}}"

# Claude Code state, published per pane by scripts/claude-state.sh from Claude's
# own hooks (see the script). Rendered twice: as a dot on the window chip, and
# and on the sidebar, which covers the sessions you cannot see.
#
# @claude_live: does this pane hold a Claude that has reported a state? The
# command check is the crash guard -- a state left behind when SessionEnd never
# ran disappears as soon as the pane runs anything else.
set -g @claude_live "#{&&:#{E:@is_claude},\
#{!=:#{@claude_state},}}"

# @claude_shown: the state as drawn. An idle Claude still waiting on a command
# it sent to the background is 'jobs' (@claude_jobs, from
# scripts/claude-jobs.sh); busy and wait are shown as they are.
set -g @claude_shown "#{?#{&&:#{==:#{@claude_state},idle},#{@claude_jobs}},jobs,#{@claude_state}}"

# Glyph and colour are chosen separately, because the same state is drawn on two
# different backgrounds: the terminal background / pill surface, where the raw
# accent is what the whole bar uses, and the active window chip, which is a
# filled mauve badge. On Macchiato that badge and the accents are both light
# pastels and the accent lands near 1.5:1 on it -- the dot is there and you
# cannot see it. @badge_icon_* is the same accent re-derived to 3:1 against that
# fill; see palette.sh.
#
# The busy glyph is animated: scripts/claude-spin.sh publishes the current
# frame in @claude_spin while any pane is mid-turn, and clears it when none is.
# Falling back to the static @ico_claude_busy is not just belt and braces -- it
# is what is drawn for the first frame-interval of every turn, and whenever the
# ticker cannot run at all.
set -g @claude_ico "#{?#{==:#{E:@claude_shown},busy},\
#{?#{==:#{@claude_spin},},#{@ico_claude_busy},#{@claude_spin}},\
#{?#{==:#{E:@claude_shown},wait},#{@ico_claude_wait},\
#{?#{==:#{E:@claude_shown},jobs},#{@ico_claude_jobs},\
#{@ico_claude_idle}}}}"

set -g @claude_col "#{?#{==:#{E:@claude_shown},busy},#{@icon_peach},\
#{?#{==:#{E:@claude_shown},wait},#{@icon_red},\
#{?#{==:#{E:@claude_shown},jobs},#{@icon_blue},\
#{@icon_green}}}}"

set -g @claude_col_badge "#{?#{==:#{E:@claude_shown},busy},#{@badge_icon_peach},\
#{?#{==:#{E:@claude_shown},wait},#{@badge_icon_red},\
#{?#{==:#{E:@claude_shown},jobs},#{@badge_icon_blue},\
#{@badge_icon_green}}}}"

# Styles stay single-attribute (#[fg=...] only): a comma inside #[...] would be
# read as a conditional separator by the parser.
set -g @claude_glyph "#[fg=#{E:@claude_col}]#{E:@claude_ico}"

# Appended to the window chip: one for the quiet chips, one for the active
# badge. The glyph is the same, only the colour is re-derived.
#
# Per pane, not per window. @claude_state is a *pane* option, and a window
# format resolves pane options against the window's active pane -- so a Claude
# in a background split simply stopped being reported the moment you focused
# the shell beside it. #{P:...} walks the window's panes instead, which also
# means a window running two agents gets two dots. Each glyph brings its own
# leading space, so a window with no agent adds nothing at all.
# Each glyph is its own click target (see the Mouse section), and it closes with
# `range=window`, not `norange`: status.c wraps every window entry in a window
# range, and a `norange` in the middle of the chip would end it early -- leaving
# the trailing pad and the right cap belonging to no window, so a click landing
# a column off the name would do nothing at all.
set -g @claude_dot "#{P:#{?#{E:@claude_live}, #[range=user|#{pane_id}]#{E:@claude_glyph}#[range=window|#{window_index}],}}"
set -g @claude_dot_badge "#{P:#{?#{E:@claude_live}, #[range=user|#{pane_id}]#[fg=#{E:@claude_col_badge}]#{E:@claude_ico}#[range=window|#{window_index}],}}"


# status left: session pill (red while the prefix is held) + zoom pill, in a
# block exactly as wide as the sidebar and its border below it: the pills, then
# more spaces than can fit, cut by status-left-length. 27 is the default
# @sidebar_width (scripts/sidebar.sh) plus one; change them together. A long
# session name is cut to fit, and the zoom pill is its icon alone.
set -g status-left-length 27
set -g status-left ""
# Zero-width: reloads the config when the OS appearance flips. See the script.
set -ga status-left "#(~/.tmux/scripts/theme-watch.sh)"
# Zero-width too: keeps each session's branch in @ws_git for the sidebar.
set -ga status-left "#(~/.tmux/scripts/ws-git.sh)"
# And this one keeps @claude_jobs, the agents' background commands.
set -ga status-left "#(~/.tmux/scripts/claude-jobs.sh)"
# An emphasis pill, so it takes @badge_* rather than the grey @fill_* the info
# pills use: a filled accent on dark, a pale wash of it on light. Both carry
# @badge_fg_*, so this needs no branching. See scripts/palette.sh.
set -ga status-left "#[fg=#{?client_prefix,#{@badge_red},#{@badge_green}},bg=default]#{@cap_l}\
#[fg=#{?client_prefix,#{@badge_fg_red},#{@badge_fg_green}},bg=#{?client_prefix,#{@badge_red},#{@badge_green}},bold]\
#{?client_prefix,#{@ico_prefix},#{@ico_session}} #{=16:session_name}\
#[fg=#{?client_prefix,#{@badge_red},#{@badge_green}},bg=default,nobold]#{@cap_r} "
set -ga status-left "#{?window_zoomed_flag,\
#[fg=#{@fill_yellow}#,bg=default]#{@cap_l}\
#[bg=#{@fill_yellow}#,bold]#[fg=#{@icon_yellow}]#{@ico_zoom}\
#[fg=#{@fill_yellow}#,bg=default#,nobold]#{@cap_r} ,}"
set -ga status-left "#[default]                           "

# status right: docker
#
# One job, not one per module. tmux redraws the status line every time a #()
# finishes, so a job apiece meant a repaint per module per interval, each a
# different width. status.sh runs the modules and emits the whole
# right side in a single write. See the script.
set -g status-right-length 250
set -g status-right ""
set -ga status-right "#(~/.tmux/scripts/status.sh \
'#{@thm_surface_0}' '#{@icon_peach}' '#{@icon_blue}' '#{@pill_text}')"
# No date, clock, battery or network pill: the Quickshell bar already draws them
# a few pixels above this one, and a status bar that repeats the
# system one is just noise. The modules and the @ico_date / @ico_clock glyphs
# are still here in scripts/ for putting any of them back.

# window look and feel: inactive windows are quiet text, the active one is a
# filled pill, so focus is obvious at a glance.
# Older Claude Code releases overwrite argv[0] with a bare version string
# ("2.1.212"), which tmux reads as the command name and would otherwise show as
# the window name. Any Claude is labelled 'claude'; every other command keeps
# its own name.
set -g automatic-rename-format "#{?#{E:@is_claude},claude,#{pane_current_command}}"

set -g window-status-format "#[fg=#{@thm_overlay_1},bg=default] #I #{E:@win_icon} #W#{E:@claude_dot} "
# The badge pads itself on both sides, where it used to sit flush against its
# caps. An MDI glyph draws wider than the cell tmux measures it as, so the round
# right cap clipped the dot; and padding only that side left the chip visibly
# lopsided on windows that had one. A space at each end is symmetric whether or
# not the window holds an agent.
set -g window-status-current-format "#[fg=#{@badge_mauve},bg=default]#{@cap_l}\
#[fg=#{@badge_fg_mauve},bg=#{@badge_mauve},bold] #I #{E:@win_icon} #W#{E:@claude_dot_badge} \
#[fg=#{@badge_mauve},bg=default,nobold]#{@cap_r}"

set -g window-status-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_1}"
set -g window-status-activity-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-bell-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-separator ""

# pane border look and feel
setw -g pane-border-status top
# Nothing over the sidebar: it is not a pane you work in.
setw -g pane-border-format "#{?#{@sidebar},,#{?pane_active,#[fg=#{@thm_blue},bg=default]#[fg=#{@thm_bg},bg=#{@thm_blue}] #P #{pane_current_command} #[fg=#{@thm_blue},bg=default],#[fg=#{@thm_overlay_0}] #P #{pane_current_command} }}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_1}"
setw -g pane-border-style "bg=default,fg=#{@thm_overlay_0}"

# Must stay last: tpm loads catppuccin, which keeps the @thm_* palette set
# above.
run '~/.tmux/plugins/tpm/tpm'

# After tpm, not before: this reads the @thm_* palette catppuccin publishes and
# derives the pill colors from it. The formats above reference the @badge_* /
# @fill_* / @icon_* / @text_* it sets, which tmux expands lazily on each redraw
# — so setting them after the formats are defined is fine.
run-shell '~/.tmux/scripts/palette.sh'

# The sidebar's border row in the focused colour. It never has the focus, so it
# would otherwise be the one pale stretch of the rule under the bar, broken off
# where the pane beside it starts. After tpm, because catppuccin writes
# pane-border-style from @catppuccin_pane_border_style with set -F, which
# would evaluate the condition once, at load, instead of per pane.
setw -g pane-border-style "fg=#{?#{@sidebar},#{@thm_fg},#{@thm_overlay_0}}"
