# Copy mode's look, shared by ~/.tmux.conf and scratch.conf. Needs the flavor's
# @thm_* palette already set; -F resolves it now, which is fine because a flavor
# flip reloads both.

# Selection: the flavor file's @mode_bg (kitty's selection_background).
set -gF mode-style "bg=#{@mode_bg},fg=#{@thm_fg},bold"

# Search hits: every match a yellow badge, the one the cursor is on peach, a
# mark mauve. The defaults are terminal cyan/magenta, which on Nord are close
# to the selection and hard to tell apart from it.
set -gF copy-mode-match-style "bg=#{@thm_yellow},fg=#{@thm_bg}"
set -gF copy-mode-current-match-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
set -gF copy-mode-mark-style "bg=#{@thm_mauve},fg=#{@thm_bg}"

# A one-column scrollbar while scrolled back (copy or view mode), overlaid on
# the pane's right edge so nothing reflows; gone again when you leave. Only the
# slider is drawn; the track is the pane's own background.
setw -g pane-scrollbars modal
setw -g pane-scrollbars-position right
setw -gF pane-scrollbars-style "bg=default,fg=#{@thm_overlay_1},width=1,pad=0"
