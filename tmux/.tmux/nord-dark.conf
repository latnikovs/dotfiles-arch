# Nord, under the Catppuccin plugin's palette names (see "Theme" in tmux.conf)
set -g @theme_mode dark

set -g @thm_bg "#2e3440"
set -g @thm_fg "#d8dee9"

set -g @thm_rosewater "#d08770"
set -g @thm_flamingo "#d08770"
set -g @thm_pink "#b48ead"
set -g @thm_mauve "#b48ead"
set -g @thm_red "#bf616a"
set -g @thm_maroon "#bf616a"
set -g @thm_peach "#d08770"
set -g @thm_yellow "#ebcb8b"
set -g @thm_green "#a3be8c"
set -g @thm_teal "#8fbcbb"
set -g @thm_sky "#88c0d0"
set -g @thm_sapphire "#88c0d0"
set -g @thm_blue "#81a1c1"
set -g @thm_lavender "#81a1c1"

set -g @thm_subtext_1 "#e5e9f0"
set -g @thm_subtext_0 "#c0c8d6"
set -g @thm_overlay_2 "#9aa5b8"
set -g @thm_overlay_1 "#7b88a1"
set -g @thm_overlay_0 "#616e88"
set -g @thm_surface_2 "#4c566a"
set -g @thm_surface_1 "#434c5e"
set -g @thm_surface_0 "#3b4252"
set -g @thm_mantle "#292e39"
set -g @thm_crust "#242933"

# Copy-mode selection (see nord-light.conf): kitty's selection_background.
set -g @mode_bg "#434c5e"

# The frame: the status bar and the workspaces sidebar, an L around the work.
# On dark it is mantle, a step below the content. On light mantle is all but
# the content's own white, and the L vanishes, so it is a frosty blue-grey of
# its own, between Nord's snow storm 4 and 5. Kept in step with
# transparent_background_colors in kitty's theme files.
set -g @frame "#292e39"

# The raised step on the frame: the active tab, the current workspace's card in
# the sidebar.
set -g @raise "#3b4252"

# Quiet text on the frame: the sidebar's header, numbers and tree lines, the
# inactive tabs' numbers. overlay_0.
set -g @dim "#616e88"
