# The scratch shell behind Prefix + t: a separate tmux server (socket "scratch")
# with one session per workspace, shown in a popup over the main one. Its own
# server, so its sessions never appear in the sidebar, the workspace numbers,
# sessionx or the resurrect saves. Prefix + t inside it hides it again; the
# shell, its history and whatever is running carry on until you `exit`.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB,xterm-256color:RGB"
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Same prefix as the main server. The popup gets every key while it is open,
# so there is no clash: the outer tmux never sees this one.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind t detach-client
bind x kill-pane

# The popup's rounded border is all the chrome it needs.
set -g status off

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
# Straight to the system clipboard: an OSC 52 from here would land in the outer
# tmux's popup, which does not pass it on to kitty.
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

if-shell '[ "$(~/.tmux/scripts/flavor.sh)" = light ]' \
	'source-file ~/.tmux/nord-light.conf' \
	'source-file ~/.tmux/nord-dark.conf'
source-file ~/.tmux/copy-mode.conf
