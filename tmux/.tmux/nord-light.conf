# Nord light: Snow Storm surfaces, Polar Night text, and the darker accents of
# OneNord Light (Nord's own are too pale to read on white), as in kitty and nvim.
# Catppuccin plugin palette names (see "Theme" in tmux.conf).
set -g @theme_mode light

set -g @thm_bg "#f7f8fa"
set -g @thm_fg "#2e3440"

set -g @thm_rosewater "#ba793e"
set -g @thm_flamingo "#ba793e"
set -g @thm_pink "#9f4aca"
set -g @thm_mauve "#9f4aca"
set -g @thm_red "#cb4f53"
set -g @thm_maroon "#cb4f53"
set -g @thm_peach "#ee5e25"
set -g @thm_yellow "#ba793e"
set -g @thm_green "#48a53d"
set -g @thm_teal "#5f9e9d"
set -g @thm_sky "#3ea1ad"
set -g @thm_sapphire "#3ea1ad"
set -g @thm_blue "#3879c5"
set -g @thm_lavender "#1b40a6"

set -g @thm_subtext_1 "#3b4252"
set -g @thm_subtext_0 "#4c566a"
set -g @thm_overlay_2 "#646a76"
set -g @thm_overlay_1 "#7b8394"
set -g @thm_overlay_0 "#a0a8b7"
set -g @thm_surface_2 "#c8ced9"
set -g @thm_surface_1 "#d8dee9"
set -g @thm_surface_0 "#e5e9f0"
set -g @thm_mantle "#eceff4"
set -g @thm_crust "#d8dee9"
