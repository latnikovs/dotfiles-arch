# App launcher (SUPER + SPACE) and the dmenu for the system, clipboard and
# keybinding menus. Nord, matching the quickshell bar and Hyprland borders.
# Colours and icons come from theme.ini, which scripts/theme points at
# nord-dark.ini or nord-light.ini; fuzzel reads it at every launch.

[main]
# App names in a proportional font; the Nerd Font is the fallback for the
# system menu's glyphs
font=Noto Sans:size=13,JetBrainsMono Nerd Font:size=13
# Sized by the output's scale, not its reported DPI (VMs and TVs report odd ones)
dpi-aware=no
prompt="   "
placeholder=Search…
terminal=kitty -e
width=36
lines=8
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=34
image-size-ratio=0.7
letter-spacing=0
include=~/.config/fuzzel/theme.ini

[border]
width=2
radius=10
selection-radius=6

[key-bindings]
# Vim-style j/k with Control, besides the arrows and Control+n/p
prev=Up Control+p Control+k
next=Down Control+n Control+j
# Control+k is next's; Control+u still clears the input
delete-line-forward=none
