# App launcher (SUPER + SPACE) and the dmenu for the system, clipboard and
# keybinding menus. Nord, matching the quickshell bar and Hyprland borders.
# Colours and icons come from theme.ini, which scripts/theme points at
# nord-dark.ini or nord-light.ini; fuzzel reads it at every launch.

[main]
# App names in a proportional font; the Nerd Font is the fallback for the
# system menu's glyphs
font=Noto Sans:size=14,JetBrainsMono Nerd Font:size=14
# Sized by the output's scale, not its reported DPI (VMs and TVs report odd ones)
dpi-aware=no
prompt="󰍉  "
placeholder=Search…
terminal=kitty -e
width=34
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=16
line-height=46
image-size-ratio=0.7
letter-spacing=0
# Bold selected entry; the n/total count right of the search field
use-bold=yes
match-counter=yes
include=~/.config/fuzzel/theme.ini

[border]
# A hairline (its colour is in theme.ini). Radius as Hyprland's windows look: their rounding
# (frame.rounding, 5) plus the 2px border drawn around it
width=1
radius=7
selection-radius=4

[key-bindings]
# Vim-style j/k with Control, besides the arrows and Control+n/p; all of them wrap
# around, so Up on the first entry selects the last one and Down on the last the first
prev=none
next=none
prev-with-wrap=Up Control+p Control+k ISO_Left_Tab
next-with-wrap=Down Control+n Control+j
# Control+k is next's; Control+u still clears the input
delete-line-forward=none
