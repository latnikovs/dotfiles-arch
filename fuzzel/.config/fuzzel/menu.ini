# The menu's submenus (hypr/scripts/menu, fuzzel --config): Left goes back to the main menu.
# custom-1 picks the entry and exits 10, which the menu reads as Back; the cursor keeps
# Control+b, and Alt+1 stays custom-1 as by default.
include=~/.config/fuzzel/fuzzel.ini

[key-bindings]
cursor-left=Control+b
custom-1=Left Mod1+1
