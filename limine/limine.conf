# Limine boot menu, in Nord colours (after Omarchy's). install.sh puts it on the boot
# partition; limine-update and limine-snapper-sync write the boot entries below.
# Options: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 3
# The first kernel: entry 1 is the Arch Linux folder they sit in
default_entry: 2
interface_branding: Arch Linux
interface_branding_color: 88c0d0
interface_help_color: 81a1c1
interface_help_color_bright: 88c0d0
hash_mismatch_panic: no

term_background: 2e3440
backdrop: 2e3440
term_foreground: d8dee9
term_foreground_bright: eceff4
term_background_bright: 3b4252
term_palette: 3b4252;bf616a;a3be8c;ebcb8b;81a1c1;b48ead;88c0d0;e5e9f0
term_palette_bright: 4c566a;bf616a;a3be8c;ebcb8b;81a1c1;b48ead;8fbcbb;eceff4
